<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('作业情况')}"></head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(user=${user})}"></div>
  <div class="main">
    <div class="topbar"><h1>作业情况</h1>
      <a th:if="${user.teacher or user.admin}" class="btn" th:href="@{/teach/homework}">作业管理</a>
    </div>
    <div class="card">
      <form method="get" class="form-row">
        <label>课程<select name="courseId"><option value="">全部</option>
          <option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseName}" th:selected="${courseId==c.id}"></option>
        </select></label>
        <button type="submit">筛选</button>
      </form>
      <table class="data">
        <thead><tr><th>作业</th><th>课程</th><th>学号</th><th>姓名</th><th>状态</th><th>得分</th><th>提交时间</th>
          <th th:if="${user.teacher or user.admin}">操作</th></tr></thead>
        <tbody>
        <tr th:each="r:${records}">
          <td th:text="${r.homeworkTitle}"></td><td th:text="${r.courseName}"></td>
          <td th:text="${r.studentNo}"></td><td th:text="${r.studentName}"></td>
          <td th:text="${r.status}"></td><td th:text="${r.score}"></td>
          <td th:text="${r.submitTime != null ? #dates.format(r.submitTime,'yyyy-MM-dd HH:mm') : '-'}"></td>
          <td th:if="${user.teacher or user.admin}">
            <form th:action="@{/teach/homework/record/delete/{id}(id=${r.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('确认删除？')">
              <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="pager" th:if="${totalPages != null and totalPages > 1}">
        <a th:if="${page > 1}" th:href="@{/homework(courseId=${courseId},page=${page-1})}">上一页</a>
        <span th:text="|第 ${page} / ${totalPages} 页，共 ${totalRows} 条|"></span>
        <a th:if="${page < totalPages}" th:href="@{/homework(courseId=${courseId},page=${page+1})}">下一页</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
