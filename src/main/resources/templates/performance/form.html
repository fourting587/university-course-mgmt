<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('表现录入')}"></head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(user=${user})}"></div>
  <div class="main">
    <div class="topbar"><h1>课堂表现录入</h1><a class="btn btn-secondary" th:href="@{/performance}">返回</a></div>
    <div class="card">
      <form th:action="@{/teach/performance/save}" method="post" class="form-row">
        <label>课程<select name="courseId" required>
          <option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseName}"></option></select></label>
        <label>学生<select name="studentId" required>
          <option th:each="s:${students}" th:value="${s.id}" th:text="${s.studentNo+' - '+s.name}"></option></select></label>
        <label>日期<input type="date" name="recordDate" required/></label>
        <label>得分<input type="number" step="0.01" min="0" max="100" name="score" required/></label>
        <label>评语<input type="text" name="comment"/></label>
        <button type="submit">保存</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
