<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('课堂表现')}"></head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(user=${user})}"></div>
  <div class="main">
    <div class="topbar"><h1>课堂表现</h1>
      <a th:if="${user.teacher or user.admin}" class="btn" th:href="@{/teach/performance}">录入表现</a>
    </div>
    <div class="card">
      <form method="get" class="form-row">
        <label>课程<select name="courseId"><option value="">全部</option>
          <option th:each="c:${courses}" th:value="${c.id}" th:text="${c.courseName}" th:selected="${courseId==c.id}"></option>
        </select></label>
        <label th:if="${!user.student}">班级<select name="clazzId"><option value="">全部</option>
          <option th:each="cl:${clazzList}" th:value="${cl.id}" th:text="${cl.className}" th:selected="${clazzId==cl.id}"></option>
        </select></label>
        <button type="submit">查询</button>
      </form>
      <table class="data">
        <thead><tr><th>日期</th><th>学号</th><th>姓名</th><th>课程</th><th>得分</th><th>评语</th>
          <th th:if="${user.teacher or user.admin}">操作</th></tr></thead>
        <tbody>
        <tr th:each="p:${list}">
          <td th:text="${#dates.format(p.recordDate,'yyyy-MM-dd')}"></td>
          <td th:text="${p.studentNo}"></td><td th:text="${p.studentName}"></td>
          <td th:text="${p.courseName}"></td><td th:text="${p.score}"></td><td th:text="${p.comment}"></td>
          <td th:if="${user.teacher or user.admin}">
            <form th:action="@{/teach/performance/delete/{id}(id=${p.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('确认删除？')">
              <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
      <div class="pager" th:if="${totalPages != null and totalPages > 1}">
        <a th:if="${page > 1}" th:href="@{/performance(courseId=${courseId},clazzId=${clazzId},page=${page-1})}">上一页</a>
        <span th:text="|第 ${page} / ${totalPages} 页，共 ${totalRows} 条|"></span>
        <a th:if="${page < totalPages}" th:href="@{/performance(courseId=${courseId},clazzId=${clazzId},page=${page+1})}">下一页</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
