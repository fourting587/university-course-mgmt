<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('登录 - 大学智能课程管理系统')}"></head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>大学智能课程管理系统</h1>
    <p class="sub">信息化系统开发与应用实训</p>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
    <form th:action="@{/doLogin}" method="post">
      <div class="field">
        <label>用户名</label>
        <input type="text" name="username" required placeholder="学号 / 工号 / admin" autofocus/>
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" required placeholder="默认 123456"/>
      </div>
      <button type="submit">登 录</button>
    </form>
    <div class="hint">
      演示账号（密码均为 123456）：<br/>
      管理员 admin · 教师 T1001 · 学生 202201001
    </div>
  </div>
</div>
</body>
</html>
