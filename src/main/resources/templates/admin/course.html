<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('课程管理')}"></head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(user=${user})}"></div>
  <div class="main">
    <div th:replace="~{fragments/common :: topbar('课程管理')}"></div>
    <div class="card">
      <form th:action="@{/admin/course/save}" method="post" class="form-row" id="courseForm">
        <input type="hidden" name="id" id="courseId"/>
        <label>课程号<input name="courseNo" id="courseNo" required/></label>
        <label>课程名<input name="courseName" id="courseName" required/></label>
        <label>学分<input type="number" step="0.5" name="credit" id="courseCredit" value="3.0"/></label>
        <label>学期<input name="semester" id="courseSemester" value="2025-2026-1" required/></label>
        <label>授课教师<select name="teacherId" id="courseTeacherId" required>
          <option th:each="t:${teachers}" th:value="${t.id}" th:text="${t.name}"></option></select></label>
        <label>授课班级（可多选）
          <select name="clazzIds" id="courseClazzIds" multiple style="min-height:70px;">
            <option th:each="cl:${clazzList}" th:value="${cl.id}" th:text="${cl.className}"></option>
          </select>
        </label>
        <button type="submit">保存课程</button>
      </form>
      <table class="data">
        <thead><tr><th>课程号</th><th>名称</th><th>学分</th><th>学期</th><th>教师</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="c:${list}">
          <td th:text="${c.courseNo}"></td><td th:text="${c.courseName}"></td>
          <td th:text="${c.credit}"></td><td th:text="${c.semester}"></td>
          <td th:text="${c.teacherName}"></td>
          <td>
            <button type="button" class="btn btn-sm btn-edit"
                    th:attr="data-id=${c.id},data-courseno=${c.courseNo},data-coursename=${c.courseName},data-credit=${c.credit},data-semester=${c.semester},data-teacherid=${c.teacherId},data-clazzids=${#strings.listJoin(c.clazzIds, ',')}"
                    onclick="editCourse(this)">编辑</button>
            <form th:action="@{/admin/course/delete/{id}(id=${c.id})}" method="post" style="display:inline"
                  onsubmit="return confirm('确认删除？')">
              <button type="submit" class="btn btn-sm btn-danger">删除</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<script>
function editCourse(btn) {
  var d = btn.dataset;
  document.getElementById('courseId').value = d.id;
  document.getElementById('courseNo').value = d.courseno || '';
  document.getElementById('courseName').value = d.coursename || '';
  document.getElementById('courseCredit').value = d.credit || '';
  document.getElementById('courseSemester').value = d.semester || '';
  document.getElementById('courseTeacherId').value = d.teacherid || '';
  var selected = (d.clazzids || '').split(',').filter(function (x) { return x !== ''; });
  var sel = document.getElementById('courseClazzIds');
  Array.prototype.forEach.call(sel.options, function (o) {
    o.selected = selected.indexOf(o.value) >= 0;
  });
  document.getElementById('courseForm').scrollIntoView({behavior: 'smooth'});
}
</script>
</body>
</html>
