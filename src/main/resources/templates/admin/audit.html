<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/common :: head('操作日志')}"></head>
<body>
<div class="layout">
  <div th:replace="~{fragments/layout :: sidebar(user=${user})}"></div>
  <div class="main">
    <div th:replace="~{fragments/common :: topbar('操作日志')}"></div>
    <div class="card">
      <p style="font-size:13px;color:#64748b;margin-top:0;">
        记录登录、密码修改、基础数据增删改、成绩录入与删除等关键操作，最新记录在最前。
      </p>
      <table class="data">
        <thead>
        <tr><th>时间</th><th>操作人</th><th>操作</th><th>对象</th><th>详情</th><th>IP</th></tr>
        </thead>
        <tbody>
        <tr th:each="a:${list}">
          <td th:text="${a.createdAt != null ? #dates.format(a.createdAt,'yyyy-MM-dd HH:mm:ss') : '-'}"></td>
          <td th:text="${a.username}"></td>
          <td th:text="${a.action}"></td>
          <td th:text="${a.target}"></td>
          <td th:text="${a.detail}"></td>
          <td th:text="${a.ip}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(list)}">
          <td colspan="6" style="text-align:center;color:#94a3b8;">暂无日志</td>
        </tr>
        </tbody>
      </table>
      <div class="pager" th:if="${totalPages != null and totalPages > 1}">
        <a th:if="${page > 1}" th:href="@{/admin/audit(page=${page-1})}">上一页</a>
        <span th:text="|第 ${page} / ${totalPages} 页，共 ${totalRows} 条|"></span>
        <a th:if="${page < totalPages}" th:href="@{/admin/audit(page=${page+1})}">下一页</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
